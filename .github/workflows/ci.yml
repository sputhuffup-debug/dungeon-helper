name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests and module conformance
        run: pnpm test
      - name: Table lint
        run: pnpm table-lint
      - name: Module check (built-in modules and the example data pack)
        run: pnpm module-check --all --quiet
      - name: Build web app
        run: pnpm --filter @campaign-forge/web build
      - name: End-to-end
        if: hashFiles('apps/web/e2e/**/*.spec.ts') != ''
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          PLAYWRIGHT_CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" \
            pnpm test:e2e
